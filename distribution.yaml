name: argent
version: 0.4.0
description: "Argent — 问述科技桌面 AI 助手，内置通用助手、HR、行政等办公角色（美客多运营见 argent-ml profile）"
author: "问述科技 (Whyshu)"
hermes_requires: ">=0.13.0"
license: MIT

# CRITICAL: SOUL.md NOT in distribution_owned
# → argent role switches are preserved across hermes profile update
# config.yaml NOT in distribution_owned (argent role 会改写 bundles/tools)
distribution_owned:
  - skills/
  - cron/
  - mcp.json
  - roles.yaml
  - souls/
  - skins/

env_requires:
  - name: WHYSHU_API_KEY
    description: "问述科技 API Key — 运行 argent login 自动获取"
    required: true
  - name: OPENAI_BASE_URL
    description: "API 代理地址"
    required: false
    default: "https://whyshu.com/api/argent/v1"
