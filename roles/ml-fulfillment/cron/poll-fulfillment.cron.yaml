# cron 任务定义模板 — ML FULL 货件轮询
#
# 功能：每 5 分钟轮询飞书多维表格，发现「待处理」FULL 货件记录后
#       自动执行 8 步货件创建流程（Playwright CDP 驱动紫鸟浏览器）。
#
# 默认不启用：复制本模板到用户配置目录 cron/ 下（或按 setup.sh 注册），
# 并确保 ~/.hermes/scripts/fulfillment.env 已填写真实凭据。
#
# 对应 setup.sh 中的注册命令：
#   hermes cron create --name "ML FULL 货件" --schedule "every 5m" \
#     --script poll-fulfillment.sh --no-agent --deliver local

name: ML FULL 货件
description: >
  轮询飞书多维表格中的 FULL 货件待办，自动执行美客多货件创建 8 步流程
  （写步骤需 --allow-write 或人工批准），结果回写飞书并归档店铺日报。

schedule: every 5m
script: poll-fulfillment.sh
no_agent: true
deliver: local

# 脚本依赖（需在运行前就绪）：
#   - /tmp/pw-venv 虚拟环境 + playwright（由 scripts/setup.sh 安装）
#   - ~/.hermes/scripts/fulfillment.env 凭据文件：
#       FEISHU_BASE_TOKEN=<PLACEHOLDER>
#       FEISHU_TABLE_ID=<PLACEHOLDER>
#       ML_STORE_ID=<PLACEHOLDER>
#       ML_STORE_NAME=<PLACEHOLDER>
#       ZINIAO_DL=<PLACEHOLDER>
#   - 紫鸟浏览器 ziniaobro 进程运行中（CDP 自动发现端口）
#   - poll-fulfillment.sh 位于 ~/.hermes/scripts/ 下，内容见
#     roles/ml-fulfillment/README.md

# 排障：
#   - 空输出 = 无待处理记录（正常静默）
#   - 非零退出 = 编排器异常，检查 fulfillment.env 与紫鸟浏览器状态
