# Argent 品牌 skin — 问述科技桌面 AI 助手
# 继承 default skin（缺失键自动回落到 default），只声明品牌差异键。
# 品牌色板：深海军蓝 #0D1B2A 系 + 青绿 #00C896 + 文字 #E8EAF2。
name: argent
description: "Argent — 深海军蓝 × 青绿，问述科技品牌主题"

colors:
  # 基础表面色 — TUI status bar / desktop GUI 由此衍生整个色板
  background: "#0D1B2A"
  # 深海军蓝系（边框 / 强调 / 填充面）
  banner_border: "#1B3A5C"
  banner_accent: "#3D6B96"
  ui_accent: "#3D6B96"
  status_bar_bg: "#0F2034"
  status_bar_dim: "#5C7691"
  session_border: "#35536F"
  completion_menu_bg: "#0F2034"
  completion_menu_current_bg: "#16324F"
  completion_menu_meta_bg: "#0F2034"
  completion_menu_meta_current_bg: "#1B3A5C"
  selection_bg: "#1B3A5C"
  voice_status_bg: "#0F2034"
  # 青绿 #00C896（标题 / 边框 / 强调文字 / 成功）
  banner_title: "#00C896"
  ui_label: "#00C896"
  ui_ok: "#00C896"
  ui_tool: "#00C896"
  prompt: "#00C896"
  input_rule: "#00C896"
  response_border: "#00C896"
  status_bar_strong: "#00C896"
  status_bar_good: "#3DD6A8"
  session_label: "#00C896"
  shell_dollar: "#00C896"
  # 文字色
  banner_text: "#E8EAF2"
  status_bar_text: "#C6D2E0"
  banner_dim: "#5C7691"
  ui_thinking: "#8FA3B8"
  # 状态
  ui_error: "#FF6B6B"
  ui_warn: "#FFA726"
  status_bar_warn: "#FFB84D"
  status_bar_bad: "#FF8C42"
  status_bar_critical: "#FF6B6B"
  # 代码 / diff 高亮
  diff_added: "#10331F"
  diff_removed: "#3A1D24"
  diff_added_word: "#00C896"
  diff_removed_word: "#FF6B6B"
  syntax_string: "#00C896"
  syntax_number: "#7FD4FF"
  syntax_keyword: "#5FB8FF"
  syntax_comment: "#5C7691"

spinner:
  waiting_faces:
    - "(✦)"
    - "(✧)"
    - "(❖)"
  thinking_faces:
    - "(✦)"
    - "(✧)"
    - "(❖)"
  thinking_verbs:
    - "处理中"
    - "分析中"
    - "计算中"
  wings:
    - ["⟪✦", "✦⟫"]

branding:
  agent_name: "Argent"
  welcome: "欢迎使用 Argent！输入消息或 /help 查看命令。"
  goodbye: "再见！✦"
  response_label: " ✦ Argent "
  prompt_symbol: "✦"
  help_header: "(✦) 可用命令"

tool_prefix: "┊"

banner_logo: |
  [bold #7FFFD4] █████╗ ██████╗  ██████╗ ███████╗███╗   ██╗████████╗[/]
  [bold #00C896]██╔══██╗██╔══██╗██╔════╝ ██╔════╝████╗  ██║╚══██╔══╝[/]
  [#00B884]███████║██████╔╝██║  ███╗█████╗  ██╔██╗ ██║   ██║   [/]
  [#00966B]██╔══██║██╔══██╗██║   ██║██╔══╝  ██║╚██╗██║   ██║   [/]
  [#007A56]██║  ██║██║  ██║╚██████╔╝███████╗██║ ╚████║   ██║   [/]
  [#005C41]╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚═╝  ╚═══╝   ╚═╝   [/]

banner_hero: |
  [#00C896]                     ✦                     [/]
  [#2BAE8C]                  ✦     ✦                  [/]
  [#1B6B52]               ✦     ✦     ✦               [/]
  [#3D6B96]            ✦     ✦     ✦     ✦            [/]
  [#35536F]         ✦     ✦     ✦     ✦     ✦         [/]
